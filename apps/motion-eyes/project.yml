name: MotionEyes
options:
  bundleIdPrefix: com.techdemos
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 6.0
packages:
  MotionEyes:
    path: Vendor/MotionEyes/package
targets:
  MotionEyes:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - Sources
    dependencies:
      - package: MotionEyes
        product: MotionEyes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.techdemos.motioneyes
        PRODUCT_NAME: MotionEyes
        PRODUCT_MODULE_NAME: MotionEyesDemo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MotionEyes
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
schemes:
  MotionEyes:
    build:
      targets:
        MotionEyes: all
    run:
      config: Debug
      commandLineArguments:
        "--motioneyes-info-logs": true
    test:
      config: Debug
