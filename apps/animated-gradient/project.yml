name: AnimatedGradient
options:
  bundleIdPrefix: com.techdemos
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 6.0
packages:
  AnimatedGradient:
    url: https://github.com/exyte/AnimatedGradient.git
    from: 1.0.1
targets:
  AnimatedGradient:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources
    dependencies:
      - package: AnimatedGradient
        product: AnimatedGradient
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.techdemos.animatedgradient
        PRODUCT_NAME: AnimatedGradient
        PRODUCT_MODULE_NAME: AnimatedGradientDemo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Gradient
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
schemes:
  AnimatedGradient:
    build:
      targets:
        AnimatedGradient: all
    run:
      config: Debug
    test:
      config: Debug
