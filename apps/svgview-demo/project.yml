name: SVGView
options:
  bundleIdPrefix: com.techdemos
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 6.0
packages:
  SVGView:
    url: https://github.com/exyte/SVGView.git
    from: 1.0.6
targets:
  SVGView:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
        excludes:
          - Artwork/**
    resources:
      - path: Sources/Artwork
    dependencies:
      - package: SVGView
        product: SVGView
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.techdemos.svgview
        PRODUCT_NAME: SVGView
        PRODUCT_MODULE_NAME: SVGViewDemo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SVGView
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
schemes:
  SVGView:
    build:
      targets:
        SVGView: all
    run:
      config: Debug
    test:
      config: Debug
