name: DrafterCharts
options:
  bundleIdPrefix: com.techdemos
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 6.0
packages:
  DrafterCharts:
    url: https://github.com/AndroidPoet/DrafterCharts
    from: 0.2.0
targets:
  DrafterCharts:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - Sources
    dependencies:
      - package: DrafterCharts
        product: DrafterCharts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.techdemos.draftercharts
        PRODUCT_NAME: DrafterCharts
        PRODUCT_MODULE_NAME: DrafterChartsDemo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: DrafterCharts
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
schemes:
  DrafterCharts:
    build:
      targets:
        DrafterCharts: all
    run:
      config: Debug
    test:
      config: Debug
