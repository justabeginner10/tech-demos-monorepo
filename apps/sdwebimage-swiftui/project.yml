name: SDWebImageSwiftUI
options:
  bundleIdPrefix: com.techdemos
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 6.0
packages:
  SDWebImageSwiftUI:
    url: https://github.com/SDWebImage/SDWebImageSwiftUI.git
    from: 3.1.4
targets:
  SDWebImageSwiftUI:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources
    dependencies:
      - package: SDWebImageSwiftUI
        product: SDWebImageSwiftUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.techdemos.sdwebimageswiftui
        PRODUCT_NAME: SDWebImageSwiftUI
        PRODUCT_MODULE_NAME: SDWebImageSwiftUIDemo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: WebImage
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
schemes:
  SDWebImageSwiftUI:
    build:
      targets:
        SDWebImageSwiftUI: all
    run:
      config: Debug
    test:
      config: Debug
