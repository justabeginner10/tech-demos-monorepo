name: Chat
options:
  bundleIdPrefix: com.techdemos
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 6.0
packages:
  Chat:
    url: https://github.com/exyte/Chat.git
    from: 3.3.7
targets:
  Chat:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources
    dependencies:
      - package: Chat
        product: ExyteChat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.techdemos.chat
        PRODUCT_NAME: Chat
        PRODUCT_MODULE_NAME: ChatDemo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Chat
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "Take a photo to attach in this demo. The picture stays on the device."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Pick a photo to attach in this demo. The picture stays on the device."
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
schemes:
  Chat:
    build:
      targets:
        Chat: all
    run:
      config: Debug
    test:
      config: Debug
