name: ConfettiSwiftUI
options:
  bundleIdPrefix: com.techdemos
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 6.0
packages:
  ConfettiSwiftUI:
    url: https://github.com/simibac/ConfettiSwiftUI.git
    from: 3.0.0
targets:
  ConfettiSwiftUI:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - Sources
    dependencies:
      - package: ConfettiSwiftUI
        product: ConfettiSwiftUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.techdemos.confettiswiftui
        PRODUCT_NAME: ConfettiSwiftUI
        PRODUCT_MODULE_NAME: ConfettiSwiftUIDemo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Confetti
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
schemes:
  ConfettiSwiftUI:
    build:
      targets:
        ConfettiSwiftUI: all
    run:
      config: Debug
    test:
      config: Debug
