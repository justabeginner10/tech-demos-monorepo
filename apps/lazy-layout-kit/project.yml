name: LazyLayoutKit
options:
  bundleIdPrefix: com.techdemos
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 6.0
packages:
  LazyLayoutKit:
    url: https://github.com/Dave861/LazyLayoutKit.git
    from: 0.3.0
targets:
  LazyLayoutKit:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - Sources
    dependencies:
      - package: LazyLayoutKit
        product: LazyLayoutKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.techdemos.lazylayoutkit
        PRODUCT_NAME: LazyLayoutKit
        PRODUCT_MODULE_NAME: LazyLayoutKitDemo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: LazyLayoutKit
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
schemes:
  LazyLayoutKit:
    build:
      targets:
        LazyLayoutKit: all
    run:
      config: Debug
    test:
      config: Debug
