name: RichTextKit
options:
  bundleIdPrefix: com.techdemos
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 6.0
packages:
  RichTextKit:
    url: https://github.com/danielsaidi/RichTextKit.git
    from: 1.2.0
targets:
  RichTextKit:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources
    dependencies:
      - package: RichTextKit
        product: RichTextKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.techdemos.richtextkit
        PRODUCT_NAME: RichTextKit
        PRODUCT_MODULE_NAME: RichTextKitDemo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: RichTextKit
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
schemes:
  RichTextKit:
    build:
      targets:
        RichTextKit: all
    run:
      config: Debug
    test:
      config: Debug
