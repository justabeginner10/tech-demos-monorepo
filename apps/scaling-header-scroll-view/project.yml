name: ScalingHeaderScrollView
options:
  bundleIdPrefix: com.techdemos
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 6.0
packages:
  ScalingHeaderScrollView:
    url: https://github.com/exyte/ScalingHeaderScrollView.git
    from: 3.1.0
targets:
  ScalingHeaderScrollView:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - Sources
    dependencies:
      - package: ScalingHeaderScrollView
        product: ScalingHeaderScrollView
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.techdemos.scalingheaderscrollview
        PRODUCT_NAME: ScalingHeaderScrollView
        PRODUCT_MODULE_NAME: ScalingHeaderScrollViewDemo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Header
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
schemes:
  ScalingHeaderScrollView:
    build:
      targets:
        ScalingHeaderScrollView: all
    run:
      config: Debug
    test:
      config: Debug
