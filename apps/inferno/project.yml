name: Inferno
options:
  bundleIdPrefix: com.techdemos
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 6.0
packages:
  Inferno:
    url: https://github.com/twostraws/Inferno.git
    revision: a40c7a0bdec03aae1bd0b96c41d6a75451bafd2c
targets:
  Inferno:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - Sources
    dependencies:
      - package: Inferno
        product: Inferno
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.techdemos.inferno
        PRODUCT_NAME: Inferno
        PRODUCT_MODULE_NAME: InfernoDemo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Inferno
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
schemes:
  Inferno:
    build:
      targets:
        Inferno: all
    run:
      config: Debug
    test:
      config: Debug
