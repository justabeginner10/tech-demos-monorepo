name: AnchoredPopup
options:
  bundleIdPrefix: com.techdemos
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 6.0
packages:
  AnchoredPopup:
    url: https://github.com/exyte/AnchoredPopup.git
    from: 1.3.1
targets:
  AnchoredPopup:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources
    dependencies:
      - package: AnchoredPopup
        product: AnchoredPopup
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.techdemos.anchoredpopup
        PRODUCT_NAME: AnchoredPopup
        PRODUCT_MODULE_NAME: AnchoredPopupDemo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Anchored Popup
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
schemes:
  AnchoredPopup:
    build:
      targets:
        AnchoredPopup: all
    run:
      config: Debug
    test:
      config: Debug
