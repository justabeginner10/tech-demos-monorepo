name: WelcomeKit
options:
  bundleIdPrefix: com.techdemos
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 6.0
packages:
  WelcomeKit:
    url: https://github.com/atoll-studio/WelcomeKit.git
    from: 1.5.0
targets:
  WelcomeKit:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - Sources
    dependencies:
      - package: WelcomeKit
        product: WelcomeKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.techdemos.welcomekit
        PRODUCT_NAME: WelcomeKit
        PRODUCT_MODULE_NAME: WelcomeKitDemo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: WelcomeKit
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
schemes:
  WelcomeKit:
    build:
      targets:
        WelcomeKit: all
    run:
      config: Debug
    test:
      config: Debug
