name: BottomSheets
options:
  bundleIdPrefix: com.techdemos
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 6.0
packages:
  BottomSheets:
    url: https://github.com/c-villain/BottomSheets
    from: 1.0.0
targets:
  BottomSheets:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - Sources
    dependencies:
      - package: BottomSheets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.techdemos.bottomsheets
        PRODUCT_NAME: BottomSheets
        PRODUCT_MODULE_NAME: BottomSheetsBackportDemo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: BottomSheets
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
schemes:
  BottomSheets:
    build:
      targets:
        BottomSheets: all
    run:
      config: Debug
    test:
      config: Debug
