name: DesignFoundation
options:
  bundleIdPrefix: com.techdemos
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 6.0
packages:
  DesignFoundation:
    url: https://github.com/NerdSnipe-Inc/design-foundation
    from: 1.7.1
targets:
  DesignFoundation:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - Sources
    dependencies:
      - package: DesignFoundation
        product: DesignFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.techdemos.designfoundation
        PRODUCT_NAME: DesignFoundation
        PRODUCT_MODULE_NAME: DesignFoundationDemo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: DesignFoundation
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
schemes:
  DesignFoundation:
    build:
      targets:
        DesignFoundation: all
    run:
      config: Debug
    test:
      config: Debug
