name: ConcentricOnboarding
options:
  bundleIdPrefix: com.techdemos
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 6.0
packages:
  ConcentricOnboarding:
    url: https://github.com/exyte/ConcentricOnboarding.git
    from: 1.1.1
targets:
  ConcentricOnboarding:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources
    dependencies:
      - package: ConcentricOnboarding
        product: ConcentricOnboarding
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.techdemos.concentriconboarding
        PRODUCT_NAME: ConcentricOnboarding
        PRODUCT_MODULE_NAME: ConcentricOnboardingDemo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Onboarding
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
schemes:
  ConcentricOnboarding:
    build:
      targets:
        ConcentricOnboarding: all
    run:
      config: Debug
    test:
      config: Debug
