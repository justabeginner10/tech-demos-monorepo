name: ProgressIndicatorView
options:
  bundleIdPrefix: com.techdemos
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 6.0
packages:
  ProgressIndicatorView:
    url: https://github.com/exyte/ProgressIndicatorView.git
    from: 1.1.0
targets:
  ProgressIndicatorView:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources
    dependencies:
      - package: ProgressIndicatorView
        product: ProgressIndicatorView
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.techdemos.progressindicatorview
        PRODUCT_NAME: ProgressIndicatorView
        PRODUCT_MODULE_NAME: ProgressIndicatorViewDemo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Progress
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
schemes:
  ProgressIndicatorView:
    build:
      targets:
        ProgressIndicatorView: all
    run:
      config: Debug
    test:
      config: Debug
