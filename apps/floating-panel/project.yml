name: FloatingPanel
options:
  bundleIdPrefix: com.techdemos
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 6.0
packages:
  FloatingPanel:
    url: https://github.com/scenee/FloatingPanel
    from: 3.2.4
targets:
  FloatingPanel:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - Sources
    dependencies:
      - package: FloatingPanel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.techdemos.floatingpanel
        PRODUCT_NAME: FloatingPanel
        PRODUCT_MODULE_NAME: FloatingPanelDemo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: FloatingPanel
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
schemes:
  FloatingPanel:
    build:
      targets:
        FloatingPanel: all
    run:
      config: Debug
    test:
      config: Debug
